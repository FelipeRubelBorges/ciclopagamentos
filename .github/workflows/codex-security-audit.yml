name: Verify security changes and scan source
on:
  push:
    branches: [codex/security-scan-20261116]
    paths: [.github/workflows/codex-security-audit.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        include: [{"repo":"nitrous","sha":"c910d4e856dbddd25e9a386ea555511667910228","patch":"{\"Gemfile\":\"source 'https://rubygems.org'\\n\\n\\n# Load Rails from RubyGems.\\ngem 'rails', '~> 8.1.0'\\n# Use sqlite3 as the database for Active Record\\ngem 'sqlite3', '~> 2.1'\\n# Use Puma as the app server\\ngem 'puma', '~> 7.0'\\n# Build JSON APIs with ease. Read more: https://github.com/rails/jbuilder\\n# gem 'jbuilder', '~> 2.5'\\n# Use Redis adapter to run Action Cable in production\\n# gem 'redis', '~> 3.0'\\n# Use ActiveModel has_secure_password\\n# gem 'bcrypt', '~> 3.1.7'\\ngem 'active_model_serializers', '~> 0.10.0'\\n# Use Capistrano for deployment\\n# gem 'capistrano-rails', group: :development\\n\\n# Use Rack CORS for handling Cross-Origin Resource Sharing (CORS), making cross-origin AJAX possible\\n# gem 'rack-cors'\\n\\ngroup :development, :test do\\n  # Call 'byebug' anywhere in the code to stop execution and get a debugger console\\n  gem 'byebug', platform: :mri\\nend\\n\\ngroup :development do\\n  gem 'listen', '~> 3.9'\\n  # Spring speeds up development by keeping your application running in the background. Read more: https://github.com/rails/spring\\nend\\n\\n# Windows does not include zoneinfo files, so bundle the tzinfo-data gem\\ngem 'tzinfo-data', platforms: [:windows, :jruby]\\n\",\"config/secrets.yml\":null,\"config/environments/test.rb\":\"Rails.application.configure do\\n  # Settings specified here will take precedence over those in config/application.rb.\\n\\n  # The test environment is used exclusively to run your application's\\n  # test suite. You never need to work with it otherwise. Remember that\\n  # your test database is \\\"scratch space\\\" for the test suite and is wiped\\n  # and recreated between test runs. Don't rely on the data there!\\n  config.cache_classes = true\\n\\n  # Do not eager load code on boot. This avoids loading your whole application\\n  # just for the purpose of running a single test. If you are using a tool that\\n  # preloads Rails for running tests, you may have to set it to true.\\n  config.eager_load = false\\n\\n  # Configure public file server for tests with Cache-Control for performance.\\n  config.public_file_server.enabled = true\\n  config.public_file_server.headers = {\\n    'Cache-Control' => 'public, max-age=3600'\\n  }\\n\\n  # Show full error reports and disable caching.\\n  config.consider_all_requests_local       = true\\n  config.action_controller.perform_caching = false\\n\\n  # Raise exceptions instead of rendering exception templates.\\n  config.action_dispatch.show_exceptions = :none\\n\\n  # Disable request forgery protection in test environment.\\n  config.action_controller.allow_forgery_protection = false\\n  config.action_mailer.perform_caching = false\\n\\n  # Tell Action Mailer not to deliver emails to the real world.\\n  # The :test delivery method accumulates sent emails in the\\n  # ActionMailer::Base.deliveries array.\\n  config.action_mailer.delivery_method = :test\\n\\n  # Print deprecation notices to the stderr.\\n  config.active_support.deprecation = :stderr\\n\\n  # Raises error for missing translations\\n  # config.action_view.raise_on_missing_translations = true\\nend\\n\",\"config/database.yml\":\"development:\\n  adapter: sqlite3\\n  pool: 5\\n  timeout: 5000\\n  database: db/development.sqlite3\\n\\ntest:\\n  adapter: sqlite3\\n  pool: 5\\n  timeout: 5000\\n  database: db/test.sqlite3\\n\\nproduction:\\n  adapter: sqlite3\\n  pool: 5\\n  timeout: 5000\\n  database: db/production.sqlite3\\n\",\"app/controllers/application_controller.rb\":\"class ApplicationController < ActionController::API\\n  before_action :require_api_token, if: -> { Rails.env.production? || ENV[\\\"NITROUS_API_TOKEN\\\"].present? }\\n\\n  private\\n\\n  def require_api_token\\n    expected = ENV[\\\"NITROUS_API_TOKEN\\\"]\\n    token = request.authorization.to_s[/\\\\ABearer ([^\\\\s]+)\\\\z/i, 1]\\n    return if expected.present? && token.present? && ActiveSupport::SecurityUtils.secure_compare(token, expected)\\n\\n    head :unauthorized\\n  end\\nend\\n\",\"test/controllers/alunos_controller_test.rb\":\"require 'test_helper'\\n\\nclass AlunosControllerTest < ActionDispatch::IntegrationTest\\n  setup do\\n    @aluno = alunos(:one)\\n  end\\n\\n  test \\\"requires a bearer token when configured\\\" do\\n    previous = ENV[\\\"NITROUS_API_TOKEN\\\"]\\n    ENV[\\\"NITROUS_API_TOKEN\\\"] = \\\"local-test-token\\\"\\n\\n    get alunos_url, as: :json\\n    assert_response :unauthorized\\n    get alunos_url, headers: { \\\"Authorization\\\" => \\\"Bearer local-test-token\\\" }, as: :json\\n    assert_response :success\\n  ensure\\n    ENV[\\\"NITROUS_API_TOKEN\\\"] = previous\\n  end\\n\\n  test \\\"should get index\\\" do\\n    get alunos_url, as: :json\\n    assert_response :success\\n  end\\n\\n  test \\\"should create aluno\\\" do\\n    assert_difference('Aluno.count') do\\n      post alunos_url, params: { aluno: { idade: @aluno.idade, nome: @aluno.nome } }, as: :json\\n    end\\n\\n    assert_response 201\\n  end\\n\\n  test \\\"should show aluno\\\" do\\n    get aluno_url(@aluno), as: :json\\n    assert_response :success\\n  end\\n\\n  test \\\"should update aluno\\\" do\\n    patch aluno_url(@aluno), params: { aluno: { idade: @aluno.idade, nome: @aluno.nome } }, as: :json\\n    assert_response 200\\n  end\\n\\n  test \\\"should destroy aluno\\\" do\\n    assert_difference('Aluno.count', -1) do\\n      delete aluno_url(@aluno), as: :json\\n    end\\n\\n    assert_response 204\\n  end\\nend\\n\",\"config/initializers/new_framework_defaults.rb\":\"# Be sure to restart your server when you modify this file.\\n#\\n# This file contains migration options to ease your Rails 5.0 upgrade.\\n#\\n# Read the Rails 5.0 release notes for more info on each option.\\n\\n# Make Ruby 2.4 preserve the timezone of the receiver when calling `to_time`.\\n# Previous versions had false.\\n\\n# Require `belongs_to` associations by default. Previous versions had false.\\nRails.application.config.active_record.belongs_to_required_by_default = true\\n\\n# Do not halt callback chains when a callback returns false. Previous versions had true.\\n\\n# Configure SSL options to enable HSTS with subdomains. Previous versions had false.\\nRails.application.config.ssl_options = { hsts: { subdomains: true } }\\n\",\"app/serializers/base_serializer.rb\":\"class BaseSerializer < ActiveModel::Serializer\\n  include Rails.application.routes.url_helpers\\nend\\n\",\"app/serializers/base_seralizer.rb\":null,\"app/models/horario.rb\":\"class Horario < ApplicationRecord\\n  belongs_to :professor, foreign_key: :id_professor\\n  belongs_to :materium, foreign_key: :id_materia\\n  belongs_to :aluno, foreign_key: :id_aluno\\nend\\n\",\"test/fixtures/horarios.yml\":\"# Read about fixtures at http://api.rubyonrails.org/classes/ActiveRecord/FixtureSet.html\\n\\none:\\n  aluno: one\\n  professor: one\\n  materium: one\\n  horario: 2016-09-22\\n\\ntwo:\\n  aluno: one\\n  professor: one\\n  materium: one\\n  horario: 2016-09-22\\n\",\"app/models/aluno.rb\":\"class Aluno < ApplicationRecord\\n  has_many :horarios, foreign_key: :id_aluno\\nend\\n\",\"app/models/professor.rb\":\"class Professor < ApplicationRecord\\n  has_many :horarios, foreign_key: :id_professor\\n\\nend\\n\",\"app/models/materium.rb\":\"class Materium < ApplicationRecord\\n  has_many :horarios, foreign_key: :id_materia\\nend\\n\"}","kind":"ruby"}]
    env:
      REPO: ${{ matrix.repo }}
      KIND: ${{ matrix.kind }}
    steps:
      - name: Check out source
        env:
          COMMIT: ${{ matrix.sha }}
        run: |
          git init -q .
          git fetch --quiet --no-tags --depth=1 "https://github.com/FelipeRubelBorges/$REPO.git" "$COMMIT"
          git checkout --quiet --detach FETCH_HEAD
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        if: matrix.kind != 'static'
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199
        if: matrix.kind == 'ruby'
        with:
          ruby-version: '3.3'
      - name: Apply proposed changes in the runner
        env:
          PATCH: ${{ matrix.patch }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          for name, data in json.loads(os.environ['PATCH']).items():
              path = pathlib.Path(name)
              if data is None:
                  path.unlink(missing_ok=True)
              else:
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_text(data)
          PY
      - name: Build and verify npm projects
        if: contains(fromJSON('["pw","cy","cy-ninja","web"]'), matrix.kind)
        run: |
          if test "$KIND" = web; then cd Angular1; fi
          if test "$KIND" = web || test "$KIND" = cy-ninja; then
            rm package-lock.json
            npm install --package-lock-only --ignore-scripts --no-audit
          fi
          npm ci --no-audit
          npm audit --json > "$RUNNER_TEMP/audit.json" || true
          node <<'NODE'
          const fs = require('node:fs')
          const a = require(process.env.RUNNER_TEMP + '/audit.json')
          if (!a.metadata?.vulnerabilities) throw Error('npm audit unavailable')
          console.log('CODEX_CHECK ' + JSON.stringify({summary:a.metadata.vulnerabilities, findings:Object.keys(a.vulnerabilities)}))
          const lock = JSON.stringify(JSON.parse(fs.readFileSync('package-lock.json','utf8')))
          for(let i=0;i<lock.length;i+=2800) console.log('CODEX_OUT package-lock.json '+i+' '+lock.slice(i,i+2800))
          console.log('CODEX_END package-lock.json '+lock.length)
          NODE
          if test "$KIND" = web; then
            npm run production
            test -s public/assets/css/app.min.css
            grep -q 'Primeira' public/index.html
            grep -q 'Menu' public/index.html
            grep -q 'Footer' public/index.html
            if grep -q data-template public/index.html; then exit 1; fi
          elif test "$KIND" = pw; then
            npm exec --offline -- playwright test --list
          else
            git ls-files -z -- '*.js' ':!:node_modules/**' | xargs -0 -r -n 1 node --check
            case "$REPO" in
              airbanktest|rain) smoke=cypress/integration/codex-security-smoke.js ;;
              cypress-project) smoke=cypress/integration/codex-security-smoke.spec.js ;;
              CypressTest) smoke=cypress/tests/e2e/codex-security-smoke.cy.js ;;
              *) smoke=cypress/e2e/codex-security-smoke.cy.js ;;
            esac
            mkdir -p "$(dirname "$smoke")"
            echo "it('loads the project configuration and runs an isolated spec', () => { expect(Cypress.version).to.match(/^16[.]/) })" > "$smoke"
            if test "$REPO" = Cypress-gitlab; then
              python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/cypress-local.log" 2>&1 &
              trap 'kill "$!" 2>/dev/null || true' EXIT
              npm exec --offline -- cypress run --config baseUrl=http://127.0.0.1:8765 --spec "$smoke"
            else
              npm exec --offline -- cypress run --spec "$smoke"
            fi
            if test "$REPO" = NinjaOne; then npm run merge-reports && npm run generate-report; fi
          fi
      - name: Build and audit Maven and Ruby
        if: matrix.kind == 'java' || matrix.kind == 'ruby'
        run: |
          curl --silent --show-error --fail --location "https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64" -o "$RUNNER_TEMP/osv"
          echo "fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8  $RUNNER_TEMP/osv" | sha256sum -c
          chmod +x "$RUNNER_TEMP/osv"
          if test "$KIND" = java; then
            java -version
            mvn -B -Dtest=RunnerTest clean test
            "$RUNNER_TEMP/osv" scan source --format json --lockfile pom.xml > "$RUNNER_TEMP/osv.json" || true
          else
            if test "$REPO" = QAfullstack; then cd ruby/capy; fi
            rm Gemfile.lock
            bundle lock
            bundle install
            if test "$REPO" = nitrous; then
              RAILS_ENV=test bundle exec rails db:migrate
              RAILS_ENV=test bundle exec rails test
            else
              bundle exec rspec --dry-run
            fi
            python3 - <<'PY'
          from pathlib import Path
          s = Path('Gemfile.lock').read_text()
          for i, line in enumerate(s.splitlines()):
              print(f'CODEX_OUT Gemfile.lock {i} {line}')
          print('CODEX_END Gemfile.lock ' + str(len(s.splitlines())))
          PY
            "$RUNNER_TEMP/osv" scan source --format json --lockfile Gemfile.lock > "$RUNNER_TEMP/osv.json" || true
          fi
          node <<'NODE'
          const d = require(process.env.RUNNER_TEMP + '/osv.json')
          const findings = (d.results ?? []).flatMap(r => r.packages.filter(p => p.vulnerabilities?.length).map(p => ({name:p.package.name,version:p.package.version,ids:p.vulnerabilities.map(v=>v.id)})))
          console.log('CODEX_OSV '+JSON.stringify({findings}))
          NODE
      - name: Scan first-party source
        if: always()
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep-venv"
          "$RUNNER_TEMP/semgrep-venv/bin/pip" -q install --disable-pip-version-check semgrep
          mkdir -p "$RUNNER_TEMP/semgrep-results"
          set +e
          "$RUNNER_TEMP/semgrep-venv/bin/semgrep" scan --metrics off --config p/security-audit --config p/owasp-top-ten --json --exclude node_modules --exclude target --exclude vendor --exclude public . > "$RUNNER_TEMP/semgrep-results/report.json" 2> "$RUNNER_TEMP/semgrep-results/errors.log"
          status=$?
          set -e
          node -e 'const r=require(process.env.RUNNER_TEMP+"/semgrep-results/report.json"); console.log("CODEX_SAST "+JSON.stringify({status:Number(process.argv[1]),errors:r.errors?.slice(0,4).map(e=>e.type),findings:r.results?.map(x=>({p:x.path,l:x.start.line,id:x.check_id,s:x.extra.severity}))}))' "$status"
