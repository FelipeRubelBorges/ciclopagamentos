e\\n\\n  # Do not eager load code on boot. This avoids loading your whole application\\n  # just for the purpose of running a single test. If you are using a tool that\\n  # preloads Rails for running tests, you may have to set it to true.\\n  config.eager_load = false\\n\\n  # Configure public file server for tests with Cache-Control for performance.\\n  config.public_file_server.enabled = true\\n  config.public_file_server.headers = {\\n    'Cache-Control' => 'public, max-age=3600'\\n  }\\n\\n  # Show full error reports and disable caching.\\n  config.consider_all_requests_local       = true\\n  config.action_controller.perform_caching = false\\n\\n  # Raise exceptions instead of rendering exception templates.\\n  config.action_dispatch.show_exceptions = :none\\n\\n  # Disable request forgery protection in test environment.\\n  config.action_controller.allow_forgery_protection = false\\n  config.action_mailer.perform_caching = false\\n\\n  # Tell Action Mailer not to deliver emails to the real world.\\n  # The :test delivery method accumulates sent emails in the\\n  # ActionMailer::Base.deliveries array.\\n  config.action_mailer.delivery_method = :test\\n\\n  # Print deprecation notices to the stderr.\\n  config.active_support.deprecation = :stderr\\n\\n  # Raises error for missing translations\\n  # config.action_view.raise_on_missing_translations = true\\nend\\n\"}","kind":"ruby"},{"repo":"BlindWarrior","sha":"2a918c8ec09202a80a776d65fe8079c90a9f989e","patch":"{}","kind":"static"},{"repo":"ciclopagamentos","sha":"b573860380879ff088127a707780f615621b21dd","patch":"{\"Angular1/package.json\":\"{\\n  \\\"name\\\": \\\"exercicios_angular\\\",\\n  \\\"version\\\": \\\"1.0.0\\\",\\n  \\\"main\\\": \\\"index.js\\\",\\n  \\\"scripts\\\": {\\n    \\\"test\\\": \\\"echo \\\\\\\"Error: no test specified\\\\\\\" && exit 1\\\",\\n    \\\"dev\\\": \\\"gulp\\\",\\n    \\\"production\\\": \\\"gulp build\\\"\\n  },\\n  \\\"author\\\": \\\"Felipe\\\",\\n  \\\"license\\\": \\\"ISC\\\",\\n  \\\"devDependencies\\\": {\\n    \\\"browser-sync\\\": \\\"3.0.4\\\",\\n    \\\"gulp\\\": \\\"5.0.1\\\",\\n    \\\"gulp-clean-css\\\": \\\"4.3.0\\\",\\n    \\\"gulp-concat\\\": \\\"2.6.1\\\"\\n  },\\n  \\\"keywords\\\": [],\\n  \\\"description\\\": \\\"\\\"\\n}\\n\",\"Angular1/app/index.html\":\"<!DOCTYPE html>\\n<html lang=\\\"pt-BR\\\">\\n    <head>\\n        <meta charset=\\\"utf-8\\\" />\\n        <title>Primeira App</title>\\n        <link rel=\\\"stylesheet\\\" href=\\\"/assets/css/app.min.css\\\" />\\n    </head>\\n    <body class=\\\"skin-blue fixed sidebar-mini\\\">\\n        <div class=\\\"wrapper\\\">\\n            <header class=\\\"main-header\\\" data-template=\\\"header.html\\\"></header>\\n            <aside class=\\\"main-sidebar\\\" data-template=\\\"menu.html\\\"></aside>\\n            <div class=\\\"content-wrapper\\\"></div>\\n            <footer class=\\\"main-footer\\\" data-template=\\\"footer.html\\\"></footer>\\n        </div>\\n    </body>\\n</html>\\n\",\"Angular1/app/index.js\":null,\"Angular1/gulpTasks/deps.js\":null,\"Angular1/app/template/header.html\":\"<a href=\\\"/#\\\" class=\\\"logo\\\">\\n    <span class=\\\"logo-mini\\\">\\n        <b>P</b>AP\\n    </span>\\n    <span class=\\\"logo-lg\\\"><span aria-hidden=\\\"true\\\">🌿</span>\\n        <b>Primeira</b>APP\\n    </span>\\n</a>\\n\",\"Angular1/app/template/template-custom.css\":\":root { font-family: Arial, sans-serif; color: #333; background: #ecf0f5; }\\nbody { margin: 0; }\\n.wrapper { display: grid; min-height: 100vh; grid-template: auto 1fr auto / 230px minmax(0, 1fr); }\\n.main-header { grid-column: 1 / -1; background: #3c8dbc; }\\n.logo { display: inline-block; padding: 14px 20px; color: #fff; background: #367fa9; font-size: 20px; text-decoration: none; }\\n.logo-mini { display: none; }\\n.main-sidebar { grid-row: 2 / 4; padding: 16px; color: #fff; background: #222d32; }\\n.main-footer { padding: 15px; background: #fff; border-top: 1px solid #d2d6de; }\\n.main-sidebar h1, .main-footer h1 { margin: 0; }\\n@media (max-width: 550px) { .wrapper { grid-template-columns: 90px minmax(0, 1fr); } .logo-mini { display: inline; } .logo-lg { display: none; } }\\n\",\"Angular1/gulpfile.js\":\"const gulp = require('gulp')\\nconst app = require('./gulpTasks/app')\\nconst server = require('./gulpTasks/server')\\n\\nexports.build = app.build\\nexports.default = gulp.series(exports.build, server)\\n\",\"Angular1/gulpTasks/server.js\":\"const gulp = require('gulp')\\nconst browserSync = require('browser-sync').create()\\nconst app = require('./app')\\n\\nmodule.exports = function server(done) {\\n    browserSync.init({\\n        server: 'public',\\n        listen: '127.0.0.1',\\n        host: '127.0.0.1',\\n        port: 3000,\\n        ui: false,\\n        ghostMode: false,\\n        files: ['public/**/*']\\n    }, done)\\n\\n    gulp.watch('app/**/*.html', app.html)\\n    gulp.watch('app/**/*.css', app.css)\\n    gulp.watch('assets/**/*.*', app.assets)\\n}\\n\",\"Angular1/gulpTasks/app.js\":\"const { cp, mkdir, readFile, writeFile } = require('node:fs/promises')\\nconst gulp = require('gulp')\\nconst cleanCss = require('gulp-clean-css')\\nconst concat = require('gulp-concat')\\n\\nasync function html() {\\n    let index = await readFile('app/index.html', 'utf8')\\n    for (const name of ['header.html', 'menu.html', 'footer.html']) {\\n        const template = await readFile('app/template/' + name, 'utf8')\\n        index = index.replace(' data-template=\\\"' + name + '\\\">', () => '>' + template.trim())\\n    }\\n    await mkdir('public', { recursive: true })\\n    await cp('app/template', 'public/template', { recursive: true })\\n    await writeFile('public/index.html', index)\\n}\\n\\nfunction css() {\\n    return gulp.src('app/**/*.css')\\n        .pipe(concat('app.min.css'))\\n        .pipe(cleanCss({ rebase: false }))\\n        .pipe(gulp.dest('public/assets/css'))\\n}\\n\\nfunction assets() {\\n    return gulp.src('assets/**/*.*', { encoding: false, allowEmpty: true })\\n        .pipe(gulp.dest('public/assets'))\\n}\\n\\nmodule.exports = { html, css, assets, build: gulp.parallel(html, css, assets) }\\n\"}","kind":"web"},{"repo":"CursoCucumber","sha":"128bb6cdbf21cdc20aa5c14ba4be72f019d22ac8","patch":"{\"pom.xml\":\"<project xmlns=\\\"http://maven.apache.org/POM/4.0.0\\\"\\n\\txmlns:xsi=\\\"http://www.w3.org/2001/XMLSchema-instance\\\"\\n\\txsi:schemaLocation=\\\"http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd\\\">\\n\\t<modelVersion>4.0.0</modelVersion>\\n\\t<groupId>CursoAppium</groupId>\\n\\t<artifactId>CursoCucumbe</artifactId>\\n\\t<version>0.0.1-SNAPSHOT</version>\\n\\t<properties>\\n\\t\\t<maven.compiler.source>17</maven.compiler.source>\\n\\t\\t<maven.compiler.target>17</maven.compiler.target>\\n\\t\\t<project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>\\n\\t</properties>\\n\\t<dependencies>\\n\\t\\t<dependency>\\n\\t\\t\\t<groupId>junit</groupId>\\n\\t\\t\\t<artifactId>junit</artifactId>\\n\\t\\t\\t<version>4.13.2</version>\\n\\t\\t\\t<scope>test</scope>\\n\\t\\t</dependency>\\n\\t\\t<dependency>\\n\\t\\t\\t<groupId>info.cukes</groupId>\\n\\t\\t\\t<artifactId>cucumber-java</artifactId>\\n\\t\\t\\t<version>1.2.5</version>\\n\\t\\t</dependency>\\n\\t\\t<dependency>\\n\\t\\t\\t<groupId>info.cukes</groupId>\\n\\t\\t\\t<artifactId>cucumber-junit</artifactId>\\n\\t\\t\\t<version>1.2.5</version>\\n\\t\\t\\t<scope>test</scope>\\n\\t\\t</dependency>\\n\\t\\t<dependency>\\n\\t\\t\\t<groupId>org.seleniumhq.selenium</groupId>\\n\\t\\t\\t<artifactId>selenium-java</artifactId>\\n\\t\\t\\t<version>4.52.0</version>\\n\\t\\t</dependency>\\n\\t\\t<dependency>\\n\\t\\t\\t<groupId>commons-io</groupId>\\n\\t\\t\\t<artifactId>commons-io</artifactId>\\n\\t\\t\\t<version>2.22.0</version>\\n\\t\\t</dependency>\\n\\n\\t</dependencies>\\n\\n</project>\"}","kind":"java"},{"repo":"QAfullstack","sha":"58659b161eb2a0f7713284d5e2a2d103713790a6","patch":"{}","kind":"ruby"},{"repo":"cypress-project","sha":"c4db039ca076da5a8d66886e41b3bf594f2106d2","patch":"{}","kind":"cy"},{"repo":"Cypress-gitlab","sha":"c272f586ce8176d0549c4d1ea3784aba45ab1474","patch":"{}","kind":"cy"},{"repo":"playwright","sha":"35d2b20c8e2b62e26ed6b849e8026d9e6e9562a4","patch":"{}","kind":"pw"},{"repo":"CypressTest","sha":"594542ef3c2138334885adcb3dd2ac248c6fdb5e","patch":"{}","kind":"cy"},{"repo":"NinjaOne","sha":"d53abab092c9143912ccc12b3f778b3b2b270ede","patch":"{\"cypress.config.js\":\"const { defineConfig } = require(\\\"cypress\\\");\\n\\nmodule.exports = defineConfig({\\n  reporter: 'mochawesome',\\n  reporterOptions: {\\n    reportDir: 'cypress/reports',\\n    overwrite: false,\\n    html: false,\\n    json: true\\n  },\\n  e2e: {\\n    specPattern: \\\"cypress/e2e/**/*.cy.js\\\",\\n    setupNodeEvents() {\\n      // implement node event listeners here\\n    }\\n  },\\n  defaultCommandTimeout: 30000,\\n  requestTimeout: 30000,\\n  responseTimeout: 30000,\\n  expose: {\\n    LANG: \\\"en-US\\\",\\n  },\\n});\\n\",\"cypress/Pages/ForgotPasswordPage.js\":\"export class ForgotPasswordPage {\\n    visit() {\\n        cy.visit('https://app.ninjarmm.com/auth/#/login', {\\n            onBeforeLoad(win) {\\n              Object.defineProperty(win.navigator, 'language', { value: Cypress.expose(\\\"LANG\\\") });\\n              Object.defineProperty(win.navigator, 'languages', { value: [Cypress.expose(\\\"LANG\\\")] });\\n            }\\n        });\\n        cy.get('a[href=\\\"#/resetPassword\\\"]').should('be.visible').click();\\n    }\\n\\n    selectIdentity(identity) {\\n        cy.get('.css-yk16xz-control').click();\\n        cy.contains('div', identity).click();\\n    }\\n\\n    sendResetPasswordByEmail(email) {\\n        cy.get('input[name=\\\"email\\\"]').type(email);\\n        cy.get('.m-t-sm').click();\\n    }\\n\\n    sendResetPasswordByText(email, phone) {\\n        cy.get('input[name=\\\"email\\\"]').type(email);\\n        cy.get('input[name=\\\"phone\\\"]').type(phone);\\n        cy.get('.m-t-sm').click();\\n    }\\n\\n    enterSecurityCode() {\\n        cy.get('label.css-wh0jfy').should('contain.text', 'Enter Security Code');\\n        cy.get('input[name=\\\"verificationCode\\\"]').should('be.visible');\\n    }\\n\\n    getSuccessMessage(message) {\\n        cy.get('.e1nhwllb0').should('be.visible').and('have.text', message);\\n    }\\n\\n    getErrorMessage(errorMessage) {\\n        cy.get('.eu2udwo9').should('be.visible').and('contain.text', errorMessage);\\n        \\n    }\\n    \\n    \\n\\n    \\n    \\n}\",\"cypress/Pages/RegisterPage.js\":\"export class RegisterPage {\\n    registerLink() {\\n      cy.visit('https://app.ninjarmm.com/auth/#/login', {\\n        onBeforeLoad(win) {\\n          Object.defineProperty(win.navigator, 'language', { value: Cypress.expose(\\\"LANG\\\") });\\n          Object.defineProperty(win.navigator, 'languages', { value: [Cypress.expose(\\\"LANG\\\")] });\\n        }\\n    });\\n      cy.get('a[href=\\\"#/register\\\"]')\\n      .should('be.visible')\\n      .click();\\n    }\\n\\n    registerFields(organization, firstName, lastName, email, password, verifyPassword, cellPhone, language) {\\n      cy.get('input[name=\\\"organization\\\"]').type(organization);\\n      cy.get('input[name=\\\"firstName\\\"]').type(firstName);\\n      cy.get('input[name=\\\"lastName\\\"]').type(lastName);\\n      cy.get('input[name=\\\"email\\\"]').type(email);\\n      cy.get('input[name=\\\"password\\\"]').type(password);\\n      cy.get('input[name=\\\"passwordConfirm\\\"]').type(verifyPassword);\\n      cy.get('input.PhoneInputInput').type(cellPhone);\\n      cy.get('.css-1uccc91-singleValue').click();\\n      cy.get('.css-1hwfws3').contains(language).click();\\n    }\\n\\n    registerButton() {\\n      cy.get('button[type=\\\"submit\\\"].btn.btn-primary.m-t-sm').click();\\n    }\\n\\n    submitRegister(successText) {\\n      this.registerButton();\\n      cy.get('p.css-bk160n').should('be.visible').and('have.text', successText);\\n\\n    }\\n\\n    getErrorText(errorText) {\\n      this.registerButton();\\n      cy.get('.invalid').should('be.visible').and('have.text', errorText);\\n    }\\n\\n    getErrorTexts(errorTexts) {\\n      this.registerButton();\\n      errorTexts.forEach(errorText => {\\n        cy.get('.invalid').should('be.visible').and('have.text', errorText);\\n      });\\n    }\\n}\\n  \",\"cypress/Pages/RequestActivationPage.js\":\"export class RequestActivationPage {\\n    requestActivationLink() {\\n        cy.visit('https://app.ninjarmm.com/auth/#/register', {\\n          onBeforeLoad(win) {\\n            Object.defineProperty(win.navigator, 'language', { value: Cypress.expose(\\\"LANG\\\") });\\n            Object.defineProperty(win.navigator, 'languages', { value: [Cypress.expose(\\\"LANG\\\")] });\\n          }\\n      });\\n        cy.get('a[href=\\\"#/requestActivation\\\"]')\\n        .should('be.visible')\\n        .click();\\n        cy.get('h2.css-1hie37q.eo7gr5w0').should('be.visible');\\n    }\\n\\n    sendActivationEmail(email) {\\n        cy.get('.form-control').type(email);\\n        cy.get('.m-t-sm').click();\\n    }\\n\\n    getSuccessMessage(successMessage) {\\n        cy.get('.css-bk160n').should('be.visible').and('contain.text', successMessage);\\n    }\\n\\n    getErrorMessage(errorMessage) {\\n        cy.get('.css-1cfrmkq').should('be.visible').and('contain.text', errorMessage);\\n    }\\n}\\n\\n\",\"cypress/Pages/SignInPage.js\":\"export class SignInPage {\\n    visit() {\\n        cy.visit('https://app.ninjarmm.com/auth/#/login', {\\n            onBeforeLoad(win) {\\n              Object.defineProperty(win.navigator, 'language', { value: Cypress.expose(\\\"LANG\\\") });\\n              Object.defineProperty(win.navigator, 'languages', { value: [Cypress.expose(\\\"LANG\\\")] });\\n            }\\n        });\\n    }\\n\\n    signInButton() {\\n        cy.contains(\\\"button\\\", \\\"Sign in\\\").click();\\n    }\\n  \\n    signIn(email, password, staySignedIn = true) {\\n      cy.get(\\\"#email\\\").type(email,{ delay: 100 });\\n      cy.get(\\\"#password\\\").type(password,{ delay: 100 });\\n      if (staySignedIn) {\\n        cy.get('.css-j5jbvc').click();\\n      }\\n      this.signInButton();\\n    }\\n  \\n    clearFields() {\\n      cy.get(\\\"#email\\\").clear();\\n      cy.get(\\\"#password\\\").clear();\\n      cy.get(\\\"#password\\\").blur();\\n    }\\n  \\n    typeEmailPassword(email, password) {\\n      cy.get(\\\"#email\\\").type(email,{ delay: 100 });\\n      cy.get(\\\"#password\\\").type(password,{ delay: 100 });\\n    }\\n\\n    getErrorText(errorText) {\\n        cy.get('.alert-danger').should('be.visible').and('have.text', errorText);\\n    }\\n\\n    getErrorBanner(errorText) {\\n      cy.get('.css-1cfrmkq.eu2udwo9')\\n      .should('be.visible')\\n      .and('contain.text', errorText);\\n    }\\n  }\\n  \",\"cypress/e2e/activationEmail.cy.js\":\"import { RequestActivationPage } from '../Pages/RequestActivationPage';\\n\\nconst requestActivationPage = new RequestActivationPage();\\nconst viewports = [\\\"macbook-15\\\", \\\"iphone-xr\\\", \\\"ipad-2\\\", \\\"samsung-s10\\\"];\\n\\nviewports.forEach((viewport) => {\\n    describe(`Request Activation Email - Viewport: \\u0024{viewport}`, () => {\\n        beforeEach(() => {\\n            cy.viewport(viewport);\\n            cy.clearCookies();\\n            cy.clearLocalStorage();\\n            requestActivationPage.requestActivationLink();\\n        });\\n\\n        it('should send activation email', () => {\\n            requestActivationPage.sendActivationEmail('paxton.stamm@yahoo.com');\\n            requestActivationPage.getSuccessMessage('Activation email sent.');\\n        });\\n\\n        it('should not send activation email with already activated email', () => {\\n            cy.env([\\\"username\\\"], { log: false }).then(({ username }) => {\\n              requestActivationPage.sendActivationEmail(username);\\n            });\\n            requestActivationPage.getSuccessMessage('The specified email already has an activated account.');\\n        });\\n\\n        it('should not send activation email with invalid email', () => {\\n            requestActivationPage.sendActivationEmail('invalidEmail@test.com')\\n            requestActivationPage.getErrorMessage('Error while requesting activation email');\\n        });\\n    });\\n});\",\"cypress/e2e/forgotPassword.cy.js\":\"import { ForgotPasswordPage } from \\\"../Pages/ForgotPasswordPage\\\";\\n\\nconst forgotPasswordPage = new ForgotPasswordPage();\\nconst viewports = [\\\"macbook-15\\\", \\\"iphone-xr\\\", \\\"ipad-2\\\", \\\"samsung-s10\\\"];\\n\\nviewports.forEach((viewport) => {\\n  describe(`Forgot Password - Viewport: \\u0024{viewport}`, () => {\\n    beforeEach(() => {\\n      cy.viewport(viewport);\\n      cy.clearCookies();\\n      cy.clearLocalStorage();\\n      forgotPasswordPage.visit();\\n    });\\n\\n    it('should send reset password by email', () => {\\n      forgotPasswordPage.selectIdentity('Email');\\n      cy.env([\\\"username\\\"], { log: false }).then(({ username }) => {\\n        forgotPasswordPage.sendResetPasswordByEmail(username);\\n      });\\n      forgotPasswordPage.getSuccessMessage('Password recovery email sent');\\n    });\\n\\n    it('should send reset password by text', () => {\\n      forgotPasswordPage.selectIdentity('Text');\\n      cy.env([\\\"username\\\"], { log: false }).then(({ username }) => {\\n        forgotPasswordPage.sendResetPasswordByText(username, '7179');\\n      });\\n      forgotPasswordPage.enterSecurityCode();\\n    });\\n\\n    it('should not send reset password by email with invalid email', () => {\\n      forgotPasswordPage.selectIdentity('Email');\\n      forgotPasswordPage.sendResetPasswordByEmail('invalidEmail@test.com');\\n      forgotPasswordPage.getErrorMessage('Error during password reset');\\n    });\\n\\n    it('should not send reset password by text with invalid phone number', () => {\\n      forgotPasswordPage.selectIdentity('Text');\\n      cy.env([\\\"username\\\"], { log: false }).then(({ username }) => {\\n        forgotPasswordPage.sendResetPasswordByText(username, '6871');\\n      });\\n      forgotPasswordPage.getErrorMessage('Error during password reset');\\n    });\\n\\n  });\\n});\\n\\n\",\"cypress/e2e/signIn.cy.js\":\"const { SignInPage } = require(\\\"../Pages/SignInPage\\\");\\n\\nconst signInPage = new SignInPage();\\nconst viewports = [\\\"macbook-15\\\", \\\"iphone-xr\\\", \\\"ipad-2\\\", \\\"samsung-s10\\\"];\\n\\nviewports.forEach((viewport) => {\\n  describe(`Sign in on NinjaOne Armm Portal - Viewport: \\u0024{viewport}`, () => {\\n    beforeEach(() => {\\n      cy.viewport(viewport);\\n      cy.clearCookies();\\n      cy.clearLocalStorage();\\n      signInPage.visit();\\n    });\\n\\n    it(\\\"should sign in successfully with staySignedIn\\\", () => {\\n      cy.env([\\\"username\\\",\\\"password\\\"], { log: false }).then(({ username, password }) => {\\n        signInPage.signIn(username, password);\\n      });\\n      cy.url().should('include', '/auth/?state=');\\n      cy.contains('h2', 'Multi-Factor Authentication').should('be.visible');\\n    });\\n\\n    it(\\\"should sign in successfully without staySignedIn\\\", () => {\\n      cy.env([\\\"username\\\",\\\"password\\\"], { log: false }).then(({ username, password }) => {\\n        signInPage.signIn(username, password, false);\\n      });\\n      cy.url().should('include', '/auth/?state=');\\n      cy.contains('h2', 'Multi-Factor Authentication').should('be.visible');\\n    });\\n\\n    it(\\\"should not sign in with blank space username and password\\\", () => {\\n      signInPage.clearFields();\\n      signInPage.signInButton();\\n      signInPage.getErrorBanner('Error during login');\\n    });\\n\\n    it(\\\"should not sign in with invalid password\\\", () => {\\n      cy.env([\\\"username\\\"], { log: false }).then(({ username }) => {\\n        signInPage.signIn(username, \\\"invalidPassword\\\");\\n      });\\n      signInPage.getErrorText('Invalid username/password. Please contact your system administrator for assistance.');\\n    });\\n\\n    //The test is desabled because is flaky and the error message is not consistent (Human Verification is required)\\n    /*it(\\\"should not sign in with invalid username\\\", () => {\\n      cy.env([\\\"password\\\"], { log: false }).then(({ password }) => {\\n        signInPage.signIn(\\\"Praxtka@ninjaone.com.br\\\", password);\\n      });\\n      signInPage.getErrorText('Invalid username/password. Please contact your system administrator for assistance.');\\n    });*/\\n  });\\n});\\n\",\".github/workflows/main.yml\":\"name: Run Cypress Tests with Report to NinjaOne Assessment\\n\\non:\\n  workflow_dispatch:\\n  push:\\n    branches: [main]\\n  pull_request:\\n\\njobs:\\n  cypress-run:\\n    runs-on: ubuntu-latest\\n\\n    steps:\\n      - name: Checkout Repository\\n        uses: actions/checkout@v4\\n\\n      - name: Setup Node.js\\n        uses: actions/setup-node@v4\\n        with:\\n          node-version: 24\\n\\n      - name: Install Dependencies\\n        run: npm ci\\n\\n      - name: Run Cypress Tests with Report\\n        run: npm run test:report\\n        env:\\n          CYPRESS_username: \\u0024{{ secrets.CYPRESS_USERNAME }}\\n          CYPRESS_password: \\u0024{{ secrets.CYPRESS_PASSWORD }}\\n\\n      - name: Upload HTML Report Artifact\\n        uses: actions/upload-artifact@v4\\n        with:\\n          name: cypress-html-report\\n          path: cypress/reports/html\",\"package.json\":\"{\\n  \\\"devDependencies\\\": {\\n    \\\"@faker-js/faker\\\": \\\"^10.6.0\\\",\\n    \\\"cypress\\\": \\\"16.3.0\\\",\\n    \\\"cypress-iframe\\\": \\\"^1.0.1\\\",\\n    \\\"eslint\\\": \\\"^9.24.0\\\",\\n    \\\"eslint-plugin-cypress\\\": \\\"^4.2.1\\\",\\n    \\\"mochawesome\\\": \\\"^8.1.1\\\",\\n    \\\"mochawesome-merge\\\": \\\"^5.0.0\\\",\\n    \\\"mochawesome-report-generator\\\": \\\"^6.2.0\\\"\\n  },\\n  \\\"scripts\\\": {\\n    \\\"test\\\": \\\"cypress run --reporter mochawesome --reporter-options reportDir=cypress/reports,overwrite=false,html=false,json=true\\\",\\n    \\\"merge-reports\\\": \\\"npx mochawesome-merge cypress/reports/*.json -o cypress/reports/report.json\\\",\\n    \\\"generate-report\\\": \\\"npx marge cypress/reports/report.json -f report -o cypress/reports/html\\\",\\n    \\\"test:report\\\": \\\"npm run test && npm run merge-reports && npm run generate-report\\\"\\n  },\\n  \\\"engines\\\": {\\n    \\\"node\\\": \\\">=22.15.0\\\"\\n  },\\n  \\\"overrides\\\": {\\n    \\\"mochawesome-merge\\\": {\\n      \\\"glob\\\": \\\"^14.0.2\\\"\\n    },\\n    \\\"mocha\\\": {\\n      \\\"glob\\\": \\\"^14.0.2\\\",\\n      \\\"minimatch\\\": \\\"^11.0.1\\\"\\n    }\\n  }\\n}\\n\"}","kind":"cy-ninja"}]
    env:
      REPO: ${{ matrix.repo }}
      KIND: ${{ matrix.kind }}
    steps:
      - name: Check out source
        env:
          COMMIT: ${{ matrix.sha }}
        run: |
          git init -q .
          git fetch --quiet --no-tags --depth=1 "https://github.com/FelipeRubelBorges/$REPO.git" "$COMMIT"
          git checkout --quiet --detach FETCH_HEAD
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        if: matrix.kind != 'static'
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199
        if: matrix.kind == 'ruby'
        with:
          ruby-version: '3.3'
      - name: Apply proposed changes in the runner
        env:
          PATCH: ${{ matrix.patch }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          for name, data in json.loads(os.environ['PATCH']).items():
              path = pathlib.Path(name)
              if data is None:
                  path.unlink(missing_ok=True)
              else:
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_text(data)
          PY
      - name: Build and verify npm projects
        if: contains(fromJSON('["pw","cy","cy-ninja","web"]'), matrix.kind)
        run: |
          if test "$KIND" = web; then cd Angular1; fi
          if test "$KIND" = web || test "$KIND" = cy-ninja; then
            rm package-lock.json
            npm install --package-lock-only --ignore-scripts --no-audit
          fi
          npm ci --no-audit
          npm audit --json > "$RUNNER_TEMP/audit.json" || true
          node <<'NODE'
          const fs = require('node:fs')
          const a = require(process.env.RUNNER_TEMP + '/audit.json')
          if (!a.metadata?.vulnerabilities) throw Error('npm audit unavailable')
          console.log('CODEX_CHECK ' + JSON.stringify({summary:a.metadata.vulnerabilities, findings:Object.keys(a.vulnerabilities)}))
          const lock = JSON.stringify(JSON.parse(fs.readFileSync('package-lock.json','utf8')))
          for(let i=0;i<lock.length;i+=2800) console.log('CODEX_OUT package-lock.json '+i+' '+lock.slice(i,i+2800))
          console.log('CODEX_END package-lock.json '+lock.length)
          NODE
          if test "$KIND" = web; then
            npm run production
            test -s public/assets/css/app.min.css
            grep -q 'Primeira' public/index.html
            grep -q 'Menu' public/index.html
            grep -q 'Footer' public/index.html
            if grep -q data-template public/index.html; then exit 1; fi
          elif test "$KIND" = pw; then
            npm exec --offline -- playwright test --list
          else
            git ls-files -z -- '*.js' ':!:node_modules/**' | xargs -0 -r -n 1 node --check
            case "$REPO" in
              airbanktest|rain) smoke=cypress/integration/codex-security-smoke.js ;;
              cypress-project) smoke=cypress/integration/codex-security-smoke.spec.js ;;
              CypressTest) smoke=cypress/tests/e2e/codex-security-smoke.cy.js ;;
              *) smoke=cypress/e2e/codex-security-smoke.cy.js ;;
            esac
            mkdir -p "$(dirname "$smoke")"
            echo "it('loads the project configuration and runs an isolated spec', () => { expect(Cypress.version).to.match(/^16[.]/) })" > "$smoke"
            npm exec --offline -- cypress run --spec "$smoke"
            if test "$REPO" = NinjaOne; then npm run merge-reports && npm run generate-report; fi
          fi
      - name: Build and audit Maven and Ruby
        if: matrix.kind == 'java' || matrix.kind == 'ruby'
        run: |
          curl --silent --show-error --fail --location "https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64" -o "$RUNNER_TEMP/osv"
          echo "fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8  $RUNNER_TEMP/osv" | sha256sum -c
          chmod +x "$RUNNER_TEMP/osv"
          if test "$KIND" = java; then
            java -version
            mvn -B -Dtest=RunnerTest test
            "$RUNNER_TEMP/osv" scan source --format json --lockfile pom.xml > "$RUNNER_TEMP/osv.json" || true
          else
            if test "$REPO" = QAfullstack; then cd ruby/capy; fi
            rm Gemfile.lock
            bundle lock
            bundle install
            if test "$REPO" = nitrous; then
              RAILS_ENV=test bundle exec rails db:migrate
              RAILS_ENV=test bundle exec rails test
            else
              bundle exec rspec --dry-run
            fi
            python3 - <<'PY'
          from pathlib import Path
          s = Path('Gemfile.lock').read_text()
          for i, line in enumerate(s.splitlines()):
              print(f'CODEX_OUT Gemfile.lock {i} {line}')
          print('CODEX_END Gemfile.lock ' + str(len(s.splitlines())))
          PY
            "$RUNNER_TEMP/osv" scan source --format json --lockfile Gemfile.lock > "$RUNNER_TEMP/osv.json" || true
          fi
          node <<'NODE'
          const d = require(process.env.RUNNER_TEMP + '/osv.json')
          const findings = (d.results ?? []).flatMap(r => r.packages.filter(p => p.vulnerabilities?.length).map(p => ({name:p.package.name,version:p.package.version,ids:p.vulnerabilities.map(v=>v.id)})))
          console.log('CODEX_OSV '+JSON.stringify({findings}))
          NODE
      - name: Scan first-party source
        if: always()
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep-venv"
          "$RUNNER_TEMP/semgrep-venv/bin/pip" -q install --disable-pip-version-check semgrep
          mkdir -p "$RUNNER_TEMP/semgrep-results"
          set +e
          "$RUNNER_TEMP/semgrep-venv/bin/semgrep" scan --metrics off --config p/security-audit --config p/owasp-top-ten --json --exclude node_modules --exclude target --exclude vendor --exclude public . > "$RUNNER_TEMP/semgrep-results/report.json" 2> "$RUNNER_TEMP/semgrep-results/errors.log"
          status=$?
          set -e
          node -e 'const r=require(process.env.RUNNER_TEMP+"/semgrep-results/report.json"); console.log("CODEX_SAST "+JSON.stringify({status:Number(process.argv[1]),errors:r.errors?.slice(0,4).map(e=>e.type),findings:r.results?.map(x=>({p:x.path,l:x.start.line,id:x.check_id,s:x.extra.severity}))}))' "$status"
