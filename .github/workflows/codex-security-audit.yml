name: Verify dependency upgrades
on:
  push:
    branches: [codex/security-scan-20261116]
    paths: [.github/workflows/codex-security-audit.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include: [{"repo":"playwright","sha":"2f366c2eaec7b5180e1989276a61015b077f5362","manifest":"{\n  \"dependencies\": {\n    \"dotenv\": \"^16.4.7\",\n    \"playwright\": \"^1.55.1\"\n  },\n  \"devDependencies\": {\n    \"@faker-js/faker\": \"^10.6.0\",\n    \"@playwright/test\": \"^1.55.1\",\n    \"@types/node\": \"^22.9.1\",\n    \"@types/pg\": \"^8.11.10\",\n    \"globals\": \"^15.14.0\",\n    \"pg\": \"^8.13.1\"\n  },\n  \"scripts\": {\n    \"test\": \"playwright test\"\n  },\n  \"engines\": {\n    \"node\": \">=22.13.0\"\n  }\n}\n"},{"repo":"CypressTest","sha":"94ebe85c28809f2ea0904e4fa695b46da1c45204","manifest":"{\n  \"devDependencies\": {\n    \"cypress\": \"16.3.0\"\n  },\n  \"name\": \"prodeal360test\",\n  \"version\": \"1.0.0\",\n  \"main\": \"index.js\",\n  \"scripts\": {\n    \"test\": \"echo \\\"Error: no test specified\\\" && exit 1\"\n  },\n  \"author\": \"\",\n  \"license\": \"ISC\",\n  \"description\": \"\",\n  \"engines\": {\n    \"node\": \">=22.15.0\"\n  }\n}\n"},{"repo":"Cypress-gitlab","sha":"c19863d990d705ad6ff6d3da9cc0a3de14a9bb07","manifest":"{\n  \"name\": \"cypress-intermediario-v2\",\n  \"version\": \"1.0.0\",\n  \"description\": \"Repositório do projeto v2 do curso de testes automatizados com Cypress (intermdiário) da Escola TAT no Udemy\",\n  \"main\": \"cypress.config.js\",\n  \"scripts\": {\n    \"test\": \"cypress run\"\n  },\n  \"repository\": {\n    \"type\": \"git\",\n    \"url\": \"git+https://github.com/wlsf82/cypress-intermediario-v2.git\"\n  },\n  \"keywords\": [\n    \"Cypress intermediário\",\n    \"Talking About Testing\",\n    \"E2E Testing\"\n  ],\n  \"author\": \"Walmyr Filho <wlsf82@gmail.com> (https://walmyr.dev/)\",\n  \"license\": \"MIT\",\n  \"bugs\": {\n    \"url\": \"https://github.com/wlsf82/cypress-intermediario-v2/issues\"\n  },\n  \"homepage\": \"https://github.com/wlsf82/cypress-intermediario-v2#readme\",\n  \"devDependencies\": {\n    \"@faker-js/faker\": \"^10.6.0\",\n    \"cypress\": \"16.3.0\",\n    \"cypress-plugin-api\": \"^2.6.1\"\n  },\n  \"engines\": {\n    \"node\": \">=22.15.0\"\n  }\n}\n"},{"repo":"NinjaOne","sha":"d53abab092c9143912ccc12b3f778b3b2b270ede","manifest":"{\n  \"devDependencies\": {\n    \"@faker-js/faker\": \"^10.6.0\",\n    \"cypress\": \"16.3.0\",\n    \"cypress-iframe\": \"^1.0.1\",\n    \"eslint\": \"^9.24.0\",\n    \"eslint-plugin-cypress\": \"^4.2.1\",\n    \"mochawesome\": \"^8.1.1\",\n    \"mochawesome-merge\": \"^5.0.0\",\n    \"mochawesome-report-generator\": \"^6.2.0\"\n  },\n  \"scripts\": {\n    \"test\": \"cypress run --reporter mochawesome --reporter-options reportDir=cypress/reports,overwrite=false,html=false,json=true\",\n    \"merge-reports\": \"npx mochawesome-merge cypress/reports/*.json -o cypress/reports/report.json\",\n    \"generate-report\": \"npx marge cypress/reports/report.json -f report -o cypress/reports/html\",\n    \"test:report\": \"npm run test && npm run merge-reports && npm run generate-report\"\n  },\n  \"engines\": {\n    \"node\": \">=22.15.0\"\n  }\n}\n"},{"repo":"cypress-project","sha":"fd593e7788f7a0a279c8e0ad2460e921fdd216b5","manifest":"{\n  \"name\": \"cypress-project\",\n  \"version\": \"1.0.0\",\n  \"main\": \"index.js\",\n  \"scripts\": {\n    \"test\": \"echo \\\"Error: no test specified\\\" && exit 1\",\n    \"cy:run\": \"cypress run\",\n    \"cypress:open\": \"cypress open\"\n  },\n  \"repository\": {\n    \"type\": \"git\",\n    \"url\": \"git+https://github.com/FelipeRubelBorges/cypress-project.git\"\n  },\n  \"keywords\": [],\n  \"author\": \"\",\n  \"license\": \"ISC\",\n  \"bugs\": {\n    \"url\": \"https://github.com/FelipeRubelBorges/cypress-project/issues\"\n  },\n  \"homepage\": \"https://github.com/FelipeRubelBorges/cypress-project#readme\",\n  \"description\": \"\",\n  \"devDependencies\": {\n    \"cypress\": \"16.3.0\"\n  },\n  \"engines\": {\n    \"node\": \">=22.15.0\"\n  }\n}\n"}]
    steps:
      - name: Check out public repository
        env:
          REPO: ${{ matrix.repo }}
          COMMIT: ${{ matrix.sha }}
        run: |
          git init -q .
          git fetch --quiet --no-tags --depth=1 "https://github.com/FelipeRubelBorges/$REPO.git" "$COMMIT"
          git checkout --quiet --detach FETCH_HEAD
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Resolve patched dependencies and verify installation
        env:
          MANIFEST: ${{ matrix.manifest }}
          REPO: ${{ matrix.repo }}
        run: |
          printf '%s' "$MANIFEST" > package.json
          rm -rf node_modules
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit
          npm ci --ignore-scripts --no-audit
          npm audit --json > "$RUNNER_TEMP/codex-audit.json" || true
          node <<'NODE'
          const fs = require('node:fs')
          const tmp = process.env.RUNNER_TEMP
          const a = JSON.parse(fs.readFileSync(tmp + '/codex-audit.json','utf8'))
          if (!a.metadata?.vulnerabilities) throw Error('npm audit did not return metadata')
          console.log('CODEX_RESULT ' + JSON.stringify({summary:a.metadata.vulnerabilities,findings:Object.values(a.vulnerabilities).map(x=>({name:x.name,fix:x.fixAvailable,via:x.via}))}))
          const lock = JSON.stringify(JSON.parse(fs.readFileSync('package-lock.json','utf8')))
          for(let i=0;i<lock.length;i+=2800) console.log('CODEX_LOCK:'+i+':'+lock.slice(i,i+2800))
          console.log('CODEX_LOCK_END:'+lock.length)
          NODE
          if test "$REPO" = playwright; then
            npm exec --offline -- playwright test --list
          else
            npm exec --offline -- cypress version --component package
          fi
