name: Verify security changes and scan source
on:
  push:
    branches: [codex/security-scan-20261116]
    paths: [.github/workflows/codex-security-audit.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        include: [{"repo":"nitrous","sha":"c910d4e856dbddd25e9a386ea555511667910228","patch":"{\"Gemfile\":\"source 'https://rubygems.org'\\n\\n\\n# Bundle edge Rails instead: gem 'rails', '~> 8.1.0'\\ngem 'rails', '~> 5.0.0', '>= 5.0.0.1'\\n# Use sqlite3 as the database for Active Record\\ngem 'sqlite3', '~> 2.1'\\n# Use Puma as the app server\\ngem 'puma', '~> 7.0'\\n# Build JSON APIs with ease. Read more: https://github.com/rails/jbuilder\\n# gem 'jbuilder', '~> 2.5'\\n# Use Redis adapter to run Action Cable in production\\n# gem 'redis', '~> 3.0'\\n# Use ActiveModel has_secure_password\\n# gem 'bcrypt', '~> 3.1.7'\\ngem 'active_model_serializers', '~> 0.10.0'\\n# Use Capistrano for deployment\\n# gem 'capistrano-rails', group: :development\\n\\n# Use Rack CORS for handling Cross-Origin Resource Sharing (CORS), making cross-origin AJAX possible\\n# gem 'rack-cors'\\n\\ngroup :development, :test do\\n  # Call 'byebug' anywhere in the code to stop execution and get a debugger console\\n  gem 'byebug', platform: :mri\\nend\\n\\ngroup :development do\\n  gem 'listen', '~> 3.9'\\n  # Spring speeds up development by keeping your application running in the background. Read more: https://github.com/rails/spring\\nend\\n\\n# Windows does not include zoneinfo files, so bundle the tzinfo-data gem\\ngem 'tzinfo-data', platforms: [:windows, :jruby]\\n\",\"config/secrets.yml\":null,\"config/environments/test.rb\":\"Rails.application.configure do\\n  # Settings specified here will take precedence over those in config/application.rb.\\n\\n  # The test environment is used exclusively to run your application's\\n  # test suite. You never need to work with it otherwise. Remember that\\n  # your test database is \\\"scratch space\\\" for the test suite and is wiped\\n  # and recreated between test runs. Don't rely on the data there!\\n  config.cache_classes = true\\n\\n  # Do not eager load code on boot. This avoids loading your whole application\\n  # just for the purpose of running a single test. If you are using a tool that\\n  # preloads Rails for running tests, you may have to set it to true.\\n  config.eager_load = false\\n\\n  # Configure public file server for tests with Cache-Control for performance.\\n  config.public_file_server.enabled = true\\n  config.public_file_server.headers = {\\n    'Cache-Control' => 'public, max-age=3600'\\n  }\\n\\n  # Show full error reports and disable caching.\\n  config.consider_all_requests_local       = true\\n  config.action_controller.perform_caching = false\\n\\n  # Raise exceptions instead of rendering exception templates.\\n  config.action_dispatch.show_exceptions = :none\\n\\n  # Disable request forgery protection in test environment.\\n  config.action_controller.allow_forgery_protection = false\\n  config.action_mailer.perform_caching = false\\n\\n  # Tell Action Mailer not to deliver emails to the real world.\\n  # The :test delivery method accumulates sent emails in the\\n  # ActionMailer::Base.deliveries array.\\n  config.action_mailer.delivery_method = :test\\n\\n  # Print deprecation notices to the stderr.\\n  config.active_support.deprecation = :stderr\\n\\n  # Raises error for missing translations\\n  # config.action_view.raise_on_missing_translations = true\\nend\\n\",\"config/database.yml\":\"development:\\n  adapter: sqlite3\\n  pool: 5\\n  timeout: 5000\\n  database: db/development.sqlite3\\n\\ntest:\\n  adapter: sqlite3\\n  pool: 5\\n  timeout: 5000\\n  database: db/test.sqlite3\\n\\nproduction:\\n  adapter: sqlite3\\n  pool: 5\\n  timeout: 5000\\n  database: db/production.sqlite3\\n\",\"app/controllers/application_controller.rb\":\"class ApplicationController < ActionController::API\\n  before_action :require_api_token, if: -> { Rails.env.production? || ENV[\\\"NITROUS_API_TOKEN\\\"].present? }\\n\\n  private\\n\\n  def require_api_token\\n    expected = ENV[\\\"NITROUS_API_TOKEN\\\"]\\n    token = request.authorization.to_s[/\\\\ABearer ([^\\\\s]+)\\\\z/i, 1]\\n    return if expected.present? && token.present? && ActiveSupport::SecurityUtils.secure_compare(token, expected)\\n\\n    head :unauthorized\\n  end\\nend\\n\"}","kind":"ruby"},{"repo":"CursoCucumber","sha":"128bb6cdbf21cdc20aa5c14ba4be72f019d22ac8","patch":"{\"pom.xml\":\"<project xmlns=\\\"http://maven.apache.org/POM/4.0.0\\\"\\n\\txmlns:xsi=\\\"http://www.w3.org/2001/XMLSchema-instance\\\"\\n\\txsi:schemaLocation=\\\"http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd\\\">\\n\\t<modelVersion>4.0.0</modelVersion>\\n\\t<groupId>CursoAppium</groupId>\\n\\t<artifactId>CursoCucumbe</artifactId>\\n\\t<version>0.0.1-SNAPSHOT</version>\\n\\t<properties>\\n\\t\\t<maven.compiler.source>17</maven.compiler.source>\\n\\t\\t<maven.compiler.target>17</maven.compiler.target>\\n\\t\\t<project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>\\n\\t</properties>\\n\\t<dependencies>\\n\\t\\t<dependency>\\n\\t\\t\\t<groupId>junit</groupId>\\n\\t\\t\\t<artifactId>junit</artifactId>\\n\\t\\t\\t<version>4.13.2</version>\\n\\t\\t\\t<scope>test</scope>\\n\\t\\t</dependency>\\n\\t\\t<dependency>\\n\\t\\t\\t<groupId>io.cucumber</groupId>\\n\\t\\t\\t<artifactId>cucumber-java</artifactId>\\n\\t\\t\\t<version>7.34.8</version>\\n\\t\\t</dependency>\\n\\t\\t<dependency>\\n\\t\\t\\t<groupId>io.cucumber</groupId>\\n\\t\\t\\t<artifactId>cucumber-junit</artifactId>\\n\\t\\t\\t<version>7.34.8</version>\\n\\t\\t\\t<scope>test</scope>\\n\\t\\t</dependency>\\n\\t\\t<dependency>\\n\\t\\t\\t<groupId>org.seleniumhq.selenium</groupId>\\n\\t\\t\\t<artifactId>selenium-java</artifactId>\\n\\t\\t\\t<version>4.52.0</version>\\n\\t\\t</dependency>\\n\\t\\t<dependency>\\n\\t\\t\\t<groupId>commons-io</groupId>\\n\\t\\t\\t<artifactId>commons-io</artifactId>\\n\\t\\t\\t<version>2.22.0</version>\\n\\t\\t</dependency>\\n\\n\\t</dependencies>\\n\\n</project>\",\"src/test/java/br/sc/fborges/runners/RunnerFuncionalTest.java\":\"package br.sc.fborges.runners;\\n\\nimport org.junit.BeforeClass;\\nimport org.junit.runner.RunWith;\\nimport org.openqa.selenium.By;\\nimport org.openqa.selenium.WebDriver;\\nimport org.openqa.selenium.chrome.ChromeDriver;\\n\\nimport io.cucumber.junit.CucumberOptions;\\nimport io.cucumber.junit.CucumberOptions.SnippetType;\\nimport io.cucumber.junit.Cucumber;\\n\\n@RunWith(Cucumber.class)\\n@CucumberOptions(\\n\\t\\tfeatures = \\\"src/test/resources/features/\\\",\\n\\t\\tglue = \\\"br.sc.fborges.steps\\\",\\n\\t\\ttags = \\\"@funcionais\\\",\\n\\t\\tplugin = {\\\"pretty\\\", \\\"html:target/report.html\\\", \\\"json:target/report.json\\\"},\\n\\t\\tmonochrome = true,\\n\\t\\tsnippets = SnippetType.CAMELCASE,\\n\\t\\tdryRun = false,\\n\\t\\tstrict = false\\n)\\n\\npublic class RunnerFuncionalTest {\\n\\t\\n\\t@BeforeClass\\n\\tpublic static void reset() {\\n\\n\\t\\t\\n\\t\\tWebDriver driver = new ChromeDriver();\\n\\t\\tdriver.get(\\\"http://srbarriga.herokuapp.com/\\\");\\n\\t\\tdriver.findElement(By.id(\\\"email\\\")).sendKeys(java.util.Objects.requireNonNull(System.getenv(\\\"CUCUMBER_TEST_EMAIL\\\"), \\\"Set CUCUMBER_TEST_EMAIL\\\"));\\n\\t\\tdriver.findElement(By.id(\\\"senha\\\")).sendKeys(java.util.Objects.requireNonNull(System.getenv(\\\"CUCUMBER_TEST_PASSWORD\\\"), \\\"Set CUCUMBER_TEST_PASSWORD\\\"));\\n\\t\\tdriver.findElement(By.tagName(\\\"button\\\")).click();\\n\\t\\tdriver.findElement(By.linkText(\\\"reset\\\")).click();\\n\\t\\tdriver.quit();\\n\\t}\\n\\n}\\n\",\"src/test/java/br/sc/fborges/runners/RunnerTest.java\":\"package br.sc.fborges.runners;\\n\\nimport org.junit.runner.RunWith;\\n\\nimport io.cucumber.junit.CucumberOptions;\\nimport io.cucumber.junit.CucumberOptions.SnippetType;\\nimport io.cucumber.junit.Cucumber;\\n\\n@RunWith(Cucumber.class)\\n@CucumberOptions(\\n\\t\\tfeatures = \\\"src/test/resources/features/\\\",\\n\\t\\tglue = \\\"br.sc.fborges.steps\\\",\\n\\t\\ttags = \\\"@unitários\\\",\\n\\t\\tplugin = {\\\"pretty\\\", \\\"html:target/report.html\\\", \\\"json:target/report.json\\\"},\\n\\t\\tmonochrome = true,\\n\\t\\tsnippets = SnippetType.CAMELCASE,\\n\\t\\tdryRun = false,\\n\\t\\tstrict = false\\n)\\n\\npublic class RunnerTest {\\n\\t\\n\\n}\\n\",\"src/test/java/br/sc/fborges/steps/AlugarFilmeSteps.java\":\"package br.sc.fborges.steps;\\n\\nimport java.text.DateFormat;\\nimport java.text.SimpleDateFormat;\\nimport java.util.Calendar;\\nimport java.util.Date;\\nimport java.util.Map;\\n\\nimport org.junit.Assert;\\n\\nimport br.sc.fborges.entidades.Filme;\\nimport br.sc.fborges.entidades.NotaAluguel;\\nimport br.sc.fborges.entidades.TipoAluguel;\\nimport br.sc.fborges.servicos.AluguelService;\\nimport br.sc.fborges.utils.DateUtils;\\nimport io.cucumber.datatable.DataTable;\\nimport io.cucumber.java.PendingException;\\nimport io.cucumber.java.java.pt.Dado;\\nimport io.cucumber.java.java.pt.Então;\\nimport io.cucumber.java.java.pt.Quando;\\n\\npublic class AlugarFilmeSteps {\\n\\n\\tprivate Filme filme;\\n\\tprivate AluguelService aluguel = new AluguelService();\\n\\tprivate NotaAluguel nota;\\n\\tprivate String erro;\\n\\tprivate TipoAluguel tipoAluguel;\\n\\n\\t@Dado(\\\"^um filme com estoque de (\\\\\\\\d+) unidades\\u0024\\\")\\n\\tpublic void umFilmeComEstoqueDeUnidades(int arg1) throws Throwable {\\n\\t\\tfilme = new Filme();\\n\\t\\tfilme.setEstoque(arg1);\\n\\n\\t}\\n\\n\\t@Dado(\\\"^que o preço do aluguel seja R\\\\\\\\\\u0024 (\\\\\\\\d+)\\u0024\\\")\\n\\tpublic void queOPreçoDoAluguelSejaR\\u0024(int arg1) throws Throwable {\\n\\t\\tfilme.setAluguel(arg1);\\n\\n\\t}\\n\\n\\t@Dado(\\\"^um filme\\u0024\\\")\\n\\tpublic void umFilme(DataTable table) throws Throwable {\\n\\t\\tMap<String, String> map = table.asMap(String.class, String.class);\\n\\t\\tfilme = new Filme();\\n\\t\\tfilme.setEstoque(Integer.parseInt(map.get(\\\"estoque\\\")));\\n\\t\\tfilme.setAluguel(Integer.parseInt(map.get(\\\"preço\\\")));\\n\\t\\tString tipo = map.get(\\\"tipo\\\");\\n\\t\\ttipoAluguel = tipo.equals(\\\"semanal\\\") ? TipoAluguel.SEMANAL\\n\\t\\t\\t\\t: tipo.equals(\\\"extendido\\\") ? TipoAluguel.EXTENDIDO : TipoAluguel.COMUM;\\n\\t}\\n\\n\\t@Quando(\\\"^alugar\\u0024\\\")\\n\\tpublic void alugar() throws Throwable {\\n\\t\\ttry {\\n\\t\\t\\tnota = aluguel.alugar(filme, tipoAluguel);\\n\\n\\t\\t} catch (RuntimeException e) {\\n\\t\\t\\terro = e.getMessage();\\n\\t\\t}\\n\\n\\t}\\n\\n\\t@Então(\\\"^o preço do aluguel será R\\\\\\\\\\u0024 (\\\\\\\\d+)\\u0024\\\")\\n\\tpublic void oPreçoDoAluguelSeráR\\u0024(int arg1) throws Throwable {\\n\\t\\tAssert.assertEquals(arg1, nota.getPreço());\\n\\n\\t}\\n\\n\\t@Então(\\\"^o estoque do filme será (\\\\\\\\d+) unidade\\u0024\\\")\\n\\tpublic void oEstoqueDoFilmeSeráUnidade(int arg1) throws Throwable {\\n\\t\\tAssert.assertEquals(arg1, filme.getEstoque());\\n\\n\\t}\\n\\n\\t@Então(\\\"^não será possível por falta de estoque\\u0024\\\")\\n\\tpublic void nãoSeráPossívelPorFaltaDeEstoque() throws Throwable {\\n\\t\\tAssert.assertEquals(\\\"Filme sem Estoque\\\", erro);\\n\\t}\\n\\n\\t@Dado(\\\"^que o tipo do aluguel seja (.*)\\u0024\\\")\\n\\tpublic void queOTipoDoAluguelSejaExtendido(String tipo) throws Throwable {\\n\\t\\ttipoAluguel = tipo.equals(\\\"semanal\\\") ? TipoAluguel.SEMANAL\\n\\t\\t\\t\\t: tipo.equals(\\\"extendido\\\") ? TipoAluguel.EXTENDIDO : TipoAluguel.COMUM;\\n\\t}\\n\\n\\t@Então(\\\"^a data de entrega será em (\\\\\\\\d+) dias?\\u0024\\\")\\n\\tpublic void aDataDeEntregaSeráEmDias(int arg1) throws Throwable {\\n\\t\\tDate dataEsperada = DateUtils.obterDataDiferencaDias(arg1);\\n\\t\\tDate dataReal = nota.getDataEntrega();\\n\\n\\t\\tDateFormat format = new SimpleDateFormat(\\\"dd/MM/yyyy\\\");\\n\\n\\t\\tAssert.assertEquals(format.format(dataEsperada), format.format(dataReal));\\n\\t}\\n\\n\\t@Então(\\\"^a pontuação será de (\\\\\\\\d+) pontos\\u0024\\\")\\n\\tpublic void aPontuaçãoSeráDePontos(int arg1) throws Throwable {\\n\\t\\tAssert.assertEquals(arg1, nota.getPontuacao());\\n\\t}\\n\\n}\\n\",\"src/test/java/br/sc/fborges/steps/InserirContasSteps.java\":\"package br.sc.fborges.steps;\\n\\nimport static org.junit.Assert.assertEquals;\\n\\nimport java.io.File;\\nimport java.io.IOException;\\n\\nimport org.apache.commons.io.FileUtils;\\nimport org.openqa.selenium.By;\\nimport org.openqa.selenium.OutputType;\\nimport org.openqa.selenium.TakesScreenshot;\\nimport org.openqa.selenium.WebDriver;\\nimport org.openqa.selenium.chrome.ChromeDriver;\\n\\nimport io.cucumber.java.Scenario;\\nimport io.cucumber.java.java.After;\\nimport io.cucumber.java.java.Before;\\nimport io.cucumber.java.java.pt.Dado;\\nimport io.cucumber.java.java.pt.Então;\\nimport io.cucumber.java.java.pt.Quando;\\n\\npublic class InserirContasSteps {\\n\\n\\tprivate WebDriver driver;\\n\\n\\t@Dado(\\\"^que desejo adicionar uma conta\\u0024\\\")\\n\\tpublic void queDesejoAdicionarUmaConta() throws Throwable {\\n\\n\\t\\tdriver = new ChromeDriver();\\n\\t\\tdriver.get(\\\"http://srbarriga.herokuapp.com/\\\");\\n\\t\\tdriver.findElement(By.id(\\\"email\\\")).sendKeys(java.util.Objects.requireNonNull(System.getenv(\\\"CUCUMBER_TEST_EMAIL\\\"), \\\"Set CUCUMBER_TEST_EMAIL\\\"));\\n\\t\\tdriver.findElement(By.id(\\\"senha\\\")).sendKeys(java.util.Objects.requireNonNull(System.getenv(\\\"CUCUMBER_TEST_PASSWORD\\\"), \\\"Set CUCUMBER_TEST_PASSWORD\\\"));\\n\\t\\tdriver.findElement(By.tagName(\\\"button\\\")).click();\\n\\t\\tdriver.findElement(By.linkText(\\\"Contas\\\")).click();\\n\\t\\tdriver.findElement(By.linkText(\\\"Adicionar\\\")).click();\\n\\t}\\n\\n\\t@Quando(\\\"^adiciono a conta \\\\\\\"([^\\\\\\\"]*)\\\\\\\"\\u0024\\\")\\n\\tpublic void adicionoAConta(String arg1) throws Throwable {\\n\\t\\tdriver.findElement(By.id(\\\"nome\\\")).sendKeys(arg1);\\n\\t\\tdriver.findElement(By.tagName(\\\"button\\\")).click();\\n\\t}\\n\\n\\t@Então(\\\"^recebo a mensagem \\\\\\\"([^\\\\\\\"]*)\\\\\\\"\\u0024\\\")\\n\\tpublic void receboAMensagem(String arg1) throws Throwable {\\n\\t\\tString texto = driver.findElement(By.xpath(\\\"//div[starts-with(@class, 'alert alert-')]\\\")).getText();\\n\\t\\tassertEquals(arg1, texto);\\n\\t}\\n\\n\\t@After(order = 1, value = \\\"@funcionais\\\")\\n\\tpublic void screenshot(Scenario cenario) {\\n\\t\\tFile file = ((TakesScreenshot) driver).getScreenshotAs(OutputType.FILE);\\n\\t\\ttry {\\n\\t\\t\\tFileUtils.copyFile(file, new File(\\\"target/screenshots/\\\" + cenario.getId() + \\\".jpg\\\"));\\n\\t\\t} catch (IOException e) {\\n\\t\\t\\te.printStackTrace();\\n\\t\\t}\\n\\t}\\n\\n\\t@After(order = 0, value = \\\"@funcionais\\\")\\n\\tpublic void fecharBrowser() {\\n\\t\\tdriver.quit();\\n\\t\\tSystem.out.println(\\\"terminando\\\");\\n\\t}\\n\\n}\\n\"}","kind":"java"},{"repo":"Cypress-gitlab","sha":"c272f586ce8176d0549c4d1ea3784aba45ab1474","patch":"{}","kind":"cy"}]
    env:
      REPO: ${{ matrix.repo }}
      KIND: ${{ matrix.kind }}
    steps:
      - name: Check out source
        env:
          COMMIT: ${{ matrix.sha }}
        run: |
          git init -q .
          git fetch --quiet --no-tags --depth=1 "https://github.com/FelipeRubelBorges/$REPO.git" "$COMMIT"
          git checkout --quiet --detach FETCH_HEAD
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        if: matrix.kind != 'static'
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199
        if: matrix.kind == 'ruby'
        with:
          ruby-version: '3.3'
      - name: Apply proposed changes in the runner
        env:
          PATCH: ${{ matrix.patch }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          for name, data in json.loads(os.environ['PATCH']).items():
              path = pathlib.Path(name)
              if data is None:
                  path.unlink(missing_ok=True)
              else:
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_text(data)
          PY
      - name: Build and verify npm projects
        if: contains(fromJSON('["pw","cy","cy-ninja","web"]'), matrix.kind)
        run: |
          if test "$KIND" = web; then cd Angular1; fi
          if test "$KIND" = web || test "$KIND" = cy-ninja; then
            rm package-lock.json
            npm install --package-lock-only --ignore-scripts --no-audit
          fi
          npm ci --no-audit
          npm audit --json > "$RUNNER_TEMP/audit.json" || true
          node <<'NODE'
          const fs = require('node:fs')
          const a = require(process.env.RUNNER_TEMP + '/audit.json')
          if (!a.metadata?.vulnerabilities) throw Error('npm audit unavailable')
          console.log('CODEX_CHECK ' + JSON.stringify({summary:a.metadata.vulnerabilities, findings:Object.keys(a.vulnerabilities)}))
          const lock = JSON.stringify(JSON.parse(fs.readFileSync('package-lock.json','utf8')))
          for(let i=0;i<lock.length;i+=2800) console.log('CODEX_OUT package-lock.json '+i+' '+lock.slice(i,i+2800))
          console.log('CODEX_END package-lock.json '+lock.length)
          NODE
          if test "$KIND" = web; then
            npm run production
            test -s public/assets/css/app.min.css
            grep -q 'Primeira' public/index.html
            grep -q 'Menu' public/index.html
            grep -q 'Footer' public/index.html
            if grep -q data-template public/index.html; then exit 1; fi
          elif test "$KIND" = pw; then
            npm exec --offline -- playwright test --list
          else
            git ls-files -z -- '*.js' ':!:node_modules/**' | xargs -0 -r -n 1 node --check
            case "$REPO" in
              airbanktest|rain) smoke=cypress/integration/codex-security-smoke.js ;;
              cypress-project) smoke=cypress/integration/codex-security-smoke.spec.js ;;
              CypressTest) smoke=cypress/tests/e2e/codex-security-smoke.cy.js ;;
              *) smoke=cypress/e2e/codex-security-smoke.cy.js ;;
            esac
            mkdir -p "$(dirname "$smoke")"
            echo "it('loads the project configuration and runs an isolated spec', () => { expect(Cypress.version).to.match(/^16[.]/) })" > "$smoke"
            if test "$REPO" = Cypress-gitlab; then
              python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/cypress-local.log" 2>&1 &
              trap 'kill "$!" 2>/dev/null || true' EXIT
              npm exec --offline -- cypress run --config baseUrl=http://127.0.0.1:8765 --spec "$smoke"
            else
              npm exec --offline -- cypress run --spec "$smoke"
            fi
            if test "$REPO" = NinjaOne; then npm run merge-reports && npm run generate-report; fi
          fi
      - name: Build and audit Maven and Ruby
        if: matrix.kind == 'java' || matrix.kind == 'ruby'
        run: |
          curl --silent --show-error --fail --location "https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64" -o "$RUNNER_TEMP/osv"
          echo "fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8  $RUNNER_TEMP/osv" | sha256sum -c
          chmod +x "$RUNNER_TEMP/osv"
          if test "$KIND" = java; then
            java -version
            mvn -B -Dtest=RunnerTest test
            "$RUNNER_TEMP/osv" scan source --format json --lockfile pom.xml > "$RUNNER_TEMP/osv.json" || true
          else
            if test "$REPO" = QAfullstack; then cd ruby/capy; fi
            rm Gemfile.lock
            bundle lock
            bundle install
            if test "$REPO" = nitrous; then
              RAILS_ENV=test bundle exec rails db:migrate
              RAILS_ENV=test bundle exec rails test
            else
              bundle exec rspec --dry-run
            fi
            python3 - <<'PY'
          from pathlib import Path
          s = Path('Gemfile.lock').read_text()
          for i, line in enumerate(s.splitlines()):
              print(f'CODEX_OUT Gemfile.lock {i} {line}')
          print('CODEX_END Gemfile.lock ' + str(len(s.splitlines())))
          PY
            "$RUNNER_TEMP/osv" scan source --format json --lockfile Gemfile.lock > "$RUNNER_TEMP/osv.json" || true
          fi
          node <<'NODE'
          const d = require(process.env.RUNNER_TEMP + '/osv.json')
          const findings = (d.results ?? []).flatMap(r => r.packages.filter(p => p.vulnerabilities?.length).map(p => ({name:p.package.name,version:p.package.version,ids:p.vulnerabilities.map(v=>v.id)})))
          console.log('CODEX_OSV '+JSON.stringify({findings}))
          NODE
      - name: Scan first-party source
        if: always()
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep-venv"
          "$RUNNER_TEMP/semgrep-venv/bin/pip" -q install --disable-pip-version-check semgrep
          mkdir -p "$RUNNER_TEMP/semgrep-results"
          set +e
          "$RUNNER_TEMP/semgrep-venv/bin/semgrep" scan --metrics off --config p/security-audit --config p/owasp-top-ten --json --exclude node_modules --exclude target --exclude vendor --exclude public . > "$RUNNER_TEMP/semgrep-results/report.json" 2> "$RUNNER_TEMP/semgrep-results/errors.log"
          status=$?
          set -e
          node -e 'const r=require(process.env.RUNNER_TEMP+"/semgrep-results/report.json"); console.log("CODEX_SAST "+JSON.stringify({status:Number(process.argv[1]),errors:r.errors?.slice(0,4).map(e=>e.type),findings:r.results?.map(x=>({p:x.path,l:x.start.line,id:x.check_id,s:x.extra.severity}))}))' "$status"
